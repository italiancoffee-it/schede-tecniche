<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Catalogo prodotti Italian Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===================== VARIABILI ===================== */
:root{
  --rosso:#d90a16; --rosso-scuro:#b8080f; --rosso-tenue:#fdeced; --riga-selezionata:#fdf4f4; --rosso-parziale:#f0a0a5;
  --testo:#222224; --testo-codici:#3c3c40; --testo-menu:#4a4a4e;
  --grigio:#6f7074; --grigio-chiaro:#8a8b8f; --grigio-intestazioni:#7a7b80;
  --bordo-campi:#e2e2e4; --bordo-tabella:#e6e6e8; --linea:#ececee; --linea-riga:#f1f1f2;
  --sfondo-chiaro:#fafafa; --hover:#f5f5f6; --hover-contatti:#f8f8f8; --casella:#c8c8cb; --vuoto:#b5b5b8; --pagina:#f4f4f5;
  --font:'Figtree',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --larghezza-menu:264px; --altezza-riga:72px;
  --colonne:52px 68px minmax(150px,1fr) minmax(130px,1fr) minmax(150px,1fr) minmax(100px,1fr) minmax(120px,1fr) minmax(130px,1fr) minmax(130px,1fr) minmax(130px,1fr) 236px 44px;
}
body.compatta{--altezza-riga:56px}

/* ===================== BASE ===================== */
body{margin:0;background:var(--pagina);font-family:var(--font);color:var(--testo);-webkit-font-smoothing:antialiased}
a{color:var(--rosso)} a:hover{color:var(--rosso)}
button{font-family:var(--font);color:inherit}
[hidden]{display:none!important}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ===================== LAYOUT ===================== */
.app{display:grid;grid-template-columns:var(--larghezza-menu) minmax(0,1fr);min-height:100vh;background:#fff}
.menu{border-right:1px solid var(--linea);display:flex;flex-direction:column;padding:24px 16px;gap:24px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}
main{display:flex;flex-direction:column;min-width:0}

/* Menu sistemi */
.sistemi{display:flex;flex-direction:column;gap:2px}
.sistema{display:flex;align-items:center;gap:12px;width:100%;padding:7px 12px;border:none;border-radius:6px;background:transparent;cursor:pointer;font:400 15px/normal var(--font);color:var(--testo-menu);text-align:left}
.sistema:hover{background:var(--hover)}
.sistema.attivo{background:var(--rosso-tenue);color:var(--rosso);font-weight:600;box-shadow:inset 3px 0 0 var(--rosso)}
.punto{width:6px;height:6px;border-radius:50%;flex:none;background:var(--casella)}
.attivo .punto{background:var(--rosso)}
.sistema .nome-s{flex:1}
.conteggio{font-size:12px;color:var(--grigio-chiaro);font-weight:500}

/* Contatti */
.contatti{margin-top:auto;padding:16px 4px 0;border-top:1px solid var(--linea);display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grigio-chiaro)}
.contatti .eyebrow{padding:0 8px 4px}
.contatto{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--bordo-campi);border-radius:8px;text-decoration:none;color:var(--testo)}
.contatto:hover{border-color:var(--rosso);background:var(--hover-contatti);color:var(--testo)}
.contatto svg{flex:none}
.contatto .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.contatto b{font-size:13px;font-weight:600}
.contatto small{font-size:12px;color:var(--grigio);overflow:hidden;text-overflow:ellipsis}

/* Testata */
.testata{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:24px 28px;background:var(--sfondo-chiaro);border-bottom:1px solid var(--linea)}
.brand{display:flex;align-items:center;gap:20px;min-width:0}
.brand .logo{height:64px;width:116px;flex:none;display:block}
.titoli{display:flex;flex-direction:column;gap:6px;min-width:0}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.disclaimer{font-size:12px;color:var(--grigio-chiaro)}

/* Pulsanti */
.btn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--bordo-campi);background:#fff;border-radius:6px;font:500 14px var(--font);color:var(--testo);cursor:pointer}
.btn:hover{border-color:var(--rosso)}
.btn.rosso{color:var(--rosso)}
.btn.primario{border:none;background:var(--rosso);color:#fff}
.btn.primario:hover{background:var(--rosso-scuro)}
.btn .lbl-c{display:none}
.btn-sm{height:34px;padding:0 12px;border:1px solid var(--bordo-campi);background:#fff;border-radius:6px;font:500 13px var(--font);color:var(--rosso);cursor:pointer;white-space:nowrap}
.btn-sm:hover{border-color:var(--rosso)}
.btn-sm:disabled{color:var(--vuoto);border-color:var(--linea);cursor:not-allowed}

/* Filtri */
.contenuto{padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.filtri{display:flex;gap:12px;flex-wrap:wrap}
.ricerca{flex:1 1 420px;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border:1px solid var(--bordo-campi);border-radius:8px}
.ricerca input{flex:1;min-width:0;border:none;outline:none;font:400 16px var(--font);color:var(--testo);background:transparent}
.ms{position:relative;flex:0 1 230px;min-width:190px}
.ms-btn{width:100%;height:52px;padding:0 14px;border:1px solid var(--bordo-campi);background:#fff;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;font:400 15px var(--font);color:var(--testo);text-align:left}
.ms.aperto .ms-btn{border-color:var(--rosso)}
.ms-btn .lab{color:var(--grigio)}
.ms-btn .val{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-pan{position:absolute;top:58px;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--bordo-tabella);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.10);padding:6px;display:none;flex-direction:column;gap:2px}
.ms.aperto .ms-pan{display:flex}
.ms-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border:none;border-radius:6px;background:none;cursor:pointer;font:400 14px var(--font);text-align:left}
.ms-opt:hover{background:var(--hover)}
.ms-azzera{border:none;border-top:1px solid var(--linea-riga);margin-top:4px;padding:9px 10px 5px;background:none;font:400 13px var(--font);color:var(--rosso);cursor:pointer;text-align:left}

/* Caselle */
.cb{box-sizing:content-box;position:relative;width:18px;height:18px;padding:0;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--casella);background:#fff;color:#fff;font-size:12px;line-height:1;flex:none}
.cb.on{border-color:var(--rosso);background:var(--rosso)}
.cb.parz{border-color:var(--rosso);background:var(--rosso-parziale)}
.ms-opt .cb{width:16px;height:16px;font-size:11px;pointer-events:none}

/* Barra prodotti */
.barra{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px}
.barra .tit{display:flex;align-items:baseline;gap:10px}
.barra h2{margin:0;font-size:19px;font-weight:600}
.risultati{font-size:14px;color:var(--grigio)}
.massivi{display:flex;gap:10px;flex-wrap:wrap;opacity:.55}
body.con-selezione .massivi{opacity:1}
.sel-tutti-m{display:none}

/* Tabella */
.tabella{border:1px solid var(--bordo-tabella);border-radius:8px;overflow-x:auto}
.tabella-inner{min-width:1520px}
.intest{display:grid;grid-template-columns:var(--colonne);align-items:center;height:46px;border-bottom:1px solid var(--bordo-tabella);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--grigio-intestazioni);background:var(--sfondo-chiaro)}
.intest>div{padding:0 12px;white-space:nowrap}
.intest .h-cb{display:flex;justify-content:center;padding:0}
.intest .h-foto{padding:0 10px}
.intest .h-dl{padding:0 16px;text-align:right}
.riga{border-bottom:1px solid var(--linea-riga);background:#fff}
.riga.sel{background:var(--riga-selezionata)}
.riga-grid{display:grid;grid-template-columns:var(--colonne);align-items:center;min-height:var(--altezza-riga);font-size:14px}
.c-head,.c-facts,.c-id{display:contents}
.c-cb{display:flex;justify-content:center}
.c-foto{padding:0 10px}
.foto{position:relative;width:44px;height:44px;border-radius:6px;border:1px solid var(--linea);background:repeating-linear-gradient(135deg,#f5f5f6 0 5px,#eeeeef 5px 10px);display:flex;align-items:center;justify-content:center;font:500 8px var(--mono);color:var(--grigio-chiaro);overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.c-sku,.c-nome{padding:8px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sku{font:500 13px var(--mono);color:var(--testo)}
.nome{font-size:14px;font-weight:600;color:var(--testo)}
.categoria{font-size:12px;color:var(--grigio-chiaro)}
.rev{align-self:flex-start;font-size:11px;color:var(--grigio);border:1px solid var(--bordo-tabella);border-radius:4px;padding:1px 6px;white-space:nowrap}
.c{padding:0 12px;color:var(--testo)}
.c.dop{display:flex;flex-direction:column;gap:3px}
.c .sub{font-size:12px;color:var(--grigio-chiaro)}
.c.codice{font:400 13px var(--mono);color:var(--testo-codici)}
.c.codice.vuoto{color:var(--vuoto)}
.c.logi{display:flex;flex-direction:column;gap:3px;font-size:13px}
.c-azioni{padding:0 16px;display:flex;gap:8px;justify-content:flex-end}
.c-exp{display:flex;justify-content:center}
.exp{width:30px;height:30px;padding:0;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--grigio);display:flex;align-items:center;justify-content:center;gap:6px}
.exp:hover{background:var(--linea-riga)}
.exp svg{transition:transform .15s}
.riga.aperta .exp svg{transform:rotate(180deg)}
.exp .lab-m{display:none}

/* Dettaglio */
.dett{padding:4px 28px 24px 120px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;font-size:13px}
.dcol{display:flex;flex-direction:column;gap:10px}
.dcol.s2{grid-column:span 2}
.pack-wrap{overflow-x:auto}
.dett.con-profilo{grid-template-columns:repeat(4,minmax(0,1fr))}
.profilo{display:flex;flex-direction:column;gap:8px}
.profilo .k{color:var(--grigio)}
.profilo .riga-k{display:flex;justify-content:space-between;gap:8px}
.profilo .forte{font-weight:600}
.profilo .sep{border-top:1px solid var(--linea-riga);padding-top:8px}
.barre{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.barre i{height:6px;border-radius:1px;background:var(--linea)}
.barre i.on{background:var(--rosso)}
.pack{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));border:1px solid var(--linea);border-radius:6px;overflow:hidden}
.pack>div{padding:8px 10px;border-top:1px solid var(--linea-riga)}
.pack .th{background:var(--sfondo-chiaro);font-weight:600;border-top:none}
.pack .k{color:var(--grigio)}
.mat{color:var(--grigio);line-height:1.5}
.cons{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--linea-riga);padding-bottom:8px}
.cons .k{color:var(--grigio)}
.cons .v{line-height:1.45}

/* Stati */
.stato-vuoto{padding:56px 20px;text-align:center;color:var(--grigio);font-size:15px}
.sk{display:block;height:10px;border-radius:4px;background:linear-gradient(90deg,#f1f1f2 0%,#f8f8f8 50%,#f1f1f2 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
.riga.scheletro .foto{background:#f1f1f2}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--testo);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .2s ease-out}

/* Elementi solo mobile */
.sistemi-m,.contatti-m{display:none}

/* ===================== MOBILE (< 600 px) ===================== */
@media (max-width:600px){
  .app{display:block}
  .menu{display:none}
  .testata{flex-direction:column;align-items:stretch;gap:14px;padding:16px}
  .brand{gap:14px}
  .brand .logo{height:44px;width:80px}
  h1{font-size:20px}
  .disclaimer{font-size:11px;line-height:1.4}
  .testata>.btn{width:100%;justify-content:center}
  .sistemi-m{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:15;background:#fff;scrollbar-width:none}
  .sistemi-m::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--bordo-campi);border-radius:18px;background:#fff;font:400 14px var(--font);color:var(--testo-menu);white-space:nowrap;cursor:pointer}
  .chip.attivo{background:var(--rosso-tenue);border-color:var(--rosso);color:var(--rosso);font-weight:600}
  .contenuto{padding:16px;gap:16px}
  .ricerca{flex-basis:100%;height:48px;padding:0 14px}
  .ms{flex:1 1 0;min-width:0}
  .ms-btn{height:48px;font-size:14px;padding:0 12px}
  .ms-pan{top:54px}
  .sel-tutti-m{display:flex;align-items:center;gap:10px;padding:8px 0;border:none;background:none;font:500 14px var(--font);cursor:pointer}
  .massivi{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;flex-wrap:nowrap;gap:8px;opacity:1;background:#fff;border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.06)}
  body.con-selezione .massivi{display:flex}
  .massivi .btn{flex:1;justify-content:center;height:44px;padding:0 10px}
  .btn .lbl-l{display:none}
  .btn .lbl-c{display:inline}
  body.con-selezione .contenuto{padding-bottom:84px}
  body.con-selezione .toast{bottom:88px}
  .tabella{border:none;border-radius:0;overflow:visible}
  .tabella-inner{min-width:0;display:flex;flex-direction:column;gap:12px}
  .intest{display:none}
  .riga{border:1px solid var(--bordo-tabella);border-radius:10px;overflow:hidden}
  .riga-grid{display:flex;flex-direction:column;align-items:stretch;gap:14px;min-height:0;padding:14px}
  .c-head{display:grid;grid-template-columns:auto 56px minmax(0,1fr);gap:12px;align-items:center}
  .c-cb,.c-foto,.c-sku,.c-nome{padding:0}
  .c-id{display:flex;flex-direction:column;gap:3px;min-width:0}
  .cb::after{content:"";position:absolute;inset:-12px}
  .foto{width:56px;height:56px}
  .c-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding-top:14px;border-top:1px solid var(--linea-riga)}
  .c{padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
  .c::before{content:attr(data-l);font:500 10px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio-chiaro);margin-bottom:2px}
  .c.codice{word-break:break-all}
  .c-azioni{padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn-sm{height:44px}
  .c-exp{display:block;margin:-6px 0 -4px}
  .exp{width:100%;height:40px;font:500 13px var(--font)}
  .exp .lab-m{display:inline}
  .dett{padding:0 14px 18px;grid-template-columns:minmax(0,1fr);gap:22px}
  .dett.con-profilo{grid-template-columns:minmax(0,1fr)}
  .dcol.s2{grid-column:auto}
  .pack{min-width:440px}
  .contatti-m{display:flex;flex-direction:column;gap:8px;padding:24px 16px 32px;border-top:1px solid var(--linea)}
  .contatti-m .eyebrow{padding:0 4px 4px}
  .contatto{padding:12px 14px}
  .toast{bottom:20px}
}
</style>
</head>
<body>
<div class="app" id="root">
  <aside class="menu">
    <nav class="sistemi" id="sistemi" aria-label="Sistemi"></nav>
    <div class="contatti" id="contatti"></div>
  </aside>

  <main>
    <header class="testata">

    "massivo-img": () => {
      const lista = prodotti.filter(p => S.sel.has(p.sku)); if (!lista.length) return toast("Seleziona almeno un prodotto");
      esegui(() => creaZip(`immagini_HQ_${lista.length}_prodotti.zip`, vociImmagini(lista, ""), lista.filter(p => !p.url_immagini.length).map(p => `${p.sku} — immagini non disponibili`)));
    },
    tutto: () => esegui(async () => {
      const id = S.sistema, pronto = CONFIG.archivi_pronti && CONFIG.archivi_pronti[id];
      const nomeZip = id === "all" ? "catalogo_italian_coffee.zip" : `catalogo_${slug(nomeSistema(id, false))}.zip`;
      toast(`Download archivio completo ${nomeSistema(id, false)} avviato`, true);
      if (pronto) { const r = await fetch(pronto); if (!r.ok) throw new Error(r.status); salvaBlob(await r.blob(), pronto.split("/").pop()); toast(`${pronto.split("/").pop()} scaricato`); return; }
      const lista = id === "all" ? prodotti : prodotti.filter(p => p.sistema === id);
      await creaZip(nomeZip, [...vociSchede(lista, "schede/"), ...vociImmagini(lista, "immagini/")]);
    })
  };

  /* ---------- eventi ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, rigaEl = el.closest(".riga"), sku = rigaEl && rigaEl.dataset.sku, p = sku && prodotti.find(x => x.sku === sku);
    switch (act) {
      case "sistema": S.sistema = el.dataset.id; S.formati = []; S.tipologie = []; S.sel.clear(); S.aperti.clear(); S.menu = null; render(); break;
      case "ms-toggle": S.menu = S.menu === el.dataset.menu ? null : el.dataset.menu; renderFiltri(); break;
      case "ms-opt": { const k = el.dataset.menu, v = el.dataset.v; S[k] = S[k].includes(v) ? S[k].filter(x => x !== v) : [...S[k], v]; renderFiltri(); renderLista(); break; }
      case "ms-azzera": S[el.dataset.menu] = []; renderFiltri(); renderLista(); break;
      case "sel": S.sel.has(sku) ? S.sel.delete(sku) : S.sel.add(sku); renderLista(); break;
      case "sel-tutti": { const r = filtrati(), tutti = r.length && r.every(x => S.sel.has(x.sku)); r.forEach(x => tutti ? S.sel.delete(x.sku) : S.sel.add(x.sku)); renderLista(); break; }
      case "apri": S.aperti.has(sku) ? S.aperti.delete(sku) : S.aperti.add(sku); renderLista(); break;
      case "azzera-filtri": e.preventDefault(); S.q = ""; $("#q").value = ""; S.formati = []; S.tipologie = []; renderFiltri(); renderLista(); break;
      default: if (azioniDownload[act]) azioniDownload[act](p);
    }
  });
  document.addEventListener("mousedown", e => { if (S.menu && !e.target.closest(".ms")) { S.menu = null; renderFiltri(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.menu) { S.menu = null; renderFiltri(); } });
  $("#q").addEventListener("input", e => { S.q = e.target.value; renderLista(); });

  /* ---------- avvio ---------- */
  const par = new URLSearchParams(location.search);
  if ((par.get("densita") || CONFIG.densita) === "compatta") document.body.classList.add("compatta");
  renderStatico();

  function avvia(dati) {
    sistemi = (dati.sistemi || []).slice().sort((a, b) => (a.ordine ?? 0) - (b.ordine ?? 0));
    prodotti = (dati.prodotti || []).map(normalizza);
    if (CONFIG.sku_aperto_iniziale && prodotti.some(p => p.sku === CONFIG.sku_aperto_iniziale)) S.aperti.add(CONFIG.sku_aperto_iniziale);
    S.stato = "pronto"; render();
  }

  if (par.get("stato") === "caricamento") { S.stato = "caricamento"; render(); }
  else if (CONFIG.url_dati) {
    S.stato = "caricamento"; render();
    fetch(CONFIG.url_dati).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(avvia)
      .catch(err => { console.error(err); S.stato = "errore"; render(); });
  } else avvia({ sistemi: SISTEMI, prodotti: PRODOTTI });
})();
</script>
</body>
</html>
